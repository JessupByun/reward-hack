# Model prices in $ per million tokens, passed to every eval with --model-cost-config.
# input_cache_write is the 5-minute rate.
# DeepInfra bf16 has no cache pricing, so both gpt-oss cache fields equal its input price.
# mockllm/model is registered in src/rewardhack/task.py instead, because set_model_cost raises for it.
anthropic/claude-haiku-5-5:
  input: 0.10
  output: 0.50
  input_cache_write: 0.125
  input_cache_read: 0.01
anthropic/claude-sonnet-5-5:
  input: 2.00
  output: 10.00
  input_cache_write: 2.50
  input_cache_read: 0.10
openrouter/openai/gpt-oss-120b:
  input: 0.037
  output: 0.17
  input_cache_write: 0.037
  input_cache_read: 0.037
