# Host pytest for the harness's own tests in tests/.
# It must never import task, sandbox or agent code. norecursedirs keeps directory recursion out of
# tasks/, sandbox/, logs/, docs/, scripts/ and .venv/; setting it replaces pytest's defaults, so the
# entries from .* onward restore them. norecursedirs does not stop a run pointed at a path, so
# tasks/conftest.py (tasks/ holds the only test modules outside tests/) makes any run pointed at a
# path under tasks/ stop before importing it; tests/test_host_pytest.py checks both.
# pythonpath lets tests import scripts/smoke_mockllm.py instead of copying its logic.
[pytest]
testpaths = tests
pythonpath = scripts
addopts = --strict-markers
norecursedirs = tasks sandbox logs docs scripts .venv .* *.egg _darcs build CVS dist node_modules venv {arch}
# inspect-ai 0.3.282 calls a deprecated tenacity argument; nothing in this repo can fix it.
filterwarnings =
    ignore:The 'initial' parameter is deprecated:DeprecationWarning:inspect_ai
markers =
    docker: needs Docker Desktop running and the sandbox image built; skipped when Docker is unavailable
